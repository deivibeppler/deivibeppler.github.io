<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CLD Clipes – Autorização</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:560px;margin:40px auto;padding:0 16px;line-height:1.5;color:#222}
  textarea{width:100%;box-sizing:border-box;height:120px;font:14px monospace;padding:8px}
  button{margin-top:10px;padding:12px 18px;font-size:16px;border:0;border-radius:8px;background:#fe2c55;color:#fff}
</style>
</head>
<body>
<h1 id="titulo">Autorização do TikTok</h1>
<p id="texto">Copie o texto abaixo e cole na conversa com o Claude.</p>
<textarea id="codigo" readonly></textarea>
<button id="copiar" type="button">Copiar</button>
<script>
  const p = new URLSearchParams(location.search);
  const caixa = document.getElementById("codigo");
  if (p.get("code")) {
    caixa.value = location.href;
  } else {
    document.getElementById("titulo").textContent = "Autorização não concluída";
    document.getElementById("texto").textContent = p.get("error_description") || p.get("error") || "Nenhum código recebido.";
    caixa.value = location.href;
  }
  document.getElementById("copiar").onclick = async () => {
    caixa.select();
    try { await navigator.clipboard.writeText(caixa.value); } catch (e) { document.execCommand("copy"); }
    document.getElementById("copiar").textContent = "Copiado!";
  };
</script>
</body>
</html>
